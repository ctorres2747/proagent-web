# Caddy site block — append to /etc/caddy/Caddyfile on the VPS
#
# The API backend (agente-inmobiliario) already uses:
#   agente.proinversores.bond { reverse_proxy 127.0.0.1:8000 }
#
# After adding this block:
#   sudo caddy validate --config /etc/caddy/Caddyfile
#   sudo systemctl reload caddy
#
# DNS (Cloudflare, DNS only): A record app → 167.233.52.184

app.proinversores.bond {
	reverse_proxy 127.0.0.1:3000
}
